name: Learner Product UI Format

on:
  push:
    branches:
      - feat/learner-product-ui-v1
    paths:
      - 'mobile/careerspeak_app/lib/**'
      - 'mobile/careerspeak_app/test/**'
      - '.github/workflows/learner-product-ui-format.yml'

permissions:
  contents: write

concurrency:
  group: learner-product-ui-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile/careerspeak_app

    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: feat/learner-product-ui-v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format Dart sources and tests
        run: dart format lib test

      - name: Commit formatter output when needed
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet -- mobile/careerspeak_app/lib mobile/careerspeak_app/test; then
            echo 'Dart sources are already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/careerspeak_app/lib mobile/careerspeak_app/test
          git commit -m 'style(flutter): normalize canonical Dart formatting'
          git push origin HEAD:feat/learner-product-ui-v1
