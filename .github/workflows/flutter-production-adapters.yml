name: Flutter Production Adapters

on:
  push:
    branches:
      - feat/p2-flutter-production-adapters
    paths:
      - 'mobile/careerspeak_app/**'
      - 'contracts/**'
      - '.github/workflows/flutter-production-adapters.yml'
  pull_request:
    paths:
      - 'mobile/careerspeak_app/**'
      - 'contracts/**'
      - '.github/workflows/flutter-production-adapters.yml'

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/careerspeak_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Apply pre-sync invariant fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('test/acceptance/p2_10_7_production_e2e_test.dart')
          text = path.read_text()
          old = """      await _pumpUntil(tester, find.byType(NavigationBar));\n      expect(find.text('Dependency Injection'), findsNothing);\n"""
          new = """      expect(find.byKey(screenshotKey), findsOneWidget);\n      expect(find.text('Dependency Injection'), findsNothing);\n"""
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('pre-sync invariant patch anchor not found')
          PY
          dart format test/acceptance/p2_10_7_production_e2e_test.dart

      - name: Commit pre-sync invariant fix
        run: |
          if [[ -n "$(git status --porcelain -- test)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add test
            git commit -m "test(p2): assert pre-sync renderer boundary without navigation coupling"
            git push origin HEAD:feat/p2-flutter-production-adapters
          fi
