name: Flutter Production Adapters

on:
  push:
    branches:
      - feat/p2-flutter-production-adapters
    paths:
      - 'mobile/careerspeak_app/**'
      - 'contracts/**'
      - '.github/workflows/flutter-production-adapters.yml'
  pull_request:
    paths:
      - 'mobile/careerspeak_app/**'
      - 'contracts/**'
      - '.github/workflows/flutter-production-adapters.yml'

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/careerspeak_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Lockfile reproducibility
        run: git diff --exit-code -- pubspec.lock

      - name: Materialize formatter repair
        run: |
          dart format lib test
          rm -rf format_artifact
          mkdir -p format_artifact/files
          git diff --name-only -- lib test > format_artifact/paths.txt
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            mkdir -p "format_artifact/files/$(dirname "$path")"
            cp "$GITHUB_WORKSPACE/$path" "format_artifact/files/$path"
          done < format_artifact/paths.txt

      - name: Upload formatter repair
        uses: actions/upload-artifact@v4
        with:
          name: p2-formatter-repair
          path: mobile/careerspeak_app/format_artifact
          if-no-files-found: error
          retention-days: 1

      - name: Format
        run: git diff --exit-code -- lib test

      - name: Drift codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Drift schema snapshot
        run: |
          dart run drift_dev schema dump \
            lib/data/local/database/careerspeak_database.dart \
            drift_schemas/drift_schema_v4.json

      - name: Drift migration test codegen
        run: |
          rm -rf test/generated_migrations
          dart run drift_dev schema generate \
            --data-classes \
            --companions \
            drift_schemas/ \
            test/generated_migrations/

      - name: Generated baseline reproducibility
        run: |
          git diff --exit-code -- \
            lib/data/local/database/careerspeak_database.g.dart \
            drift_schemas/drift_schema_v1.json \
            drift_schemas/drift_schema_v2.json \
            drift_schemas/drift_schema_v3.json \
            drift_schemas/drift_schema_v4.json \
            test/generated_migrations

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
