name: Flutter Production Adapters Patch

on:
  push:
    branches:
      - feat/p2-flutter-production-adapters
    paths:
      - '.github/workflows/flutter-production-adapters.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Apply patch
        run: |
          printf '%s' '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Format
        working-directory: mobile/careerspeak_app
        run: dart format lib test
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/careerspeak_app/lib mobile/careerspeak_app/test
          git commit -m "fix(p2): harden canonical payload staging and repair"
          git push origin HEAD:${GITHUB_REF_NAME}
