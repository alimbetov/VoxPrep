name: Flutter Production Adapters

on:
  push:
    branches:
      - feat/p2-flutter-production-adapters
    paths:
      - 'mobile/careerspeak_app/**'
      - '.github/workflows/flutter-production-adapters.yml'
  pull_request:
    paths:
      - 'mobile/careerspeak_app/**'
      - '.github/workflows/flutter-production-adapters.yml'

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/careerspeak_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
