name: Flutter Production Adapters

# P2.2 one-shot formatter normalization. Restored to read-only strict mode after writeback.
on:
  push:
    branches:
      - feat/p2-flutter-production-adapters
    paths:
      - 'mobile/careerspeak_app/**'
      - '.github/workflows/flutter-production-adapters.yml'
  pull_request:
    paths:
      - 'mobile/careerspeak_app/**'
      - '.github/workflows/flutter-production-adapters.yml'

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/careerspeak_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Lockfile reproducibility
        run: git diff --exit-code -- pubspec.lock

      - name: Format
        run: dart format lib test

      - name: Commit formatter output
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain -- lib test)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test
            git commit -m "style(p2): normalize learner persistence formatting"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Drift codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Drift schema snapshot
        run: |
          dart run drift_dev schema dump \
            lib/data/local/database/careerspeak_database.dart \
            drift_schemas/drift_schema_v1.json

      - name: Generated baseline reproducibility
        run: |
          git diff --exit-code -- \
            lib/data/local/database/careerspeak_database.g.dart \
            drift_schemas/drift_schema_v1.json

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
