name: Flutter Production Adapters

on:
  push:
    branches:
      - feat/p2-flutter-production-adapters
    paths:
      - 'mobile/careerspeak_app/**'
      - 'contracts/**'
      - '.github/workflows/flutter-production-adapters.yml'
  pull_request:
    paths:
      - 'mobile/careerspeak_app/**'
      - 'contracts/**'
      - '.github/workflows/flutter-production-adapters.yml'

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/careerspeak_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Lockfile reproducibility
        run: git diff --exit-code -- pubspec.lock

      - name: One-shot manifest formatter repair
        if: github.event_name == 'push'
        run: |
          dart format lib/data/remote/content_manifest_decoder.dart
          if ! git diff --quiet -- lib/data/remote/content_manifest_decoder.dart; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lib/data/remote/content_manifest_decoder.dart
            git commit -m 'style(p2): format manifest decoder'
            git push origin HEAD:feat/p2-flutter-production-adapters
          fi

      - name: Format handwritten Dart
        run: |
          mapfile -t dart_files < <(
            find lib test -type f -name '*.dart' \
              ! -name '*.g.dart' \
              ! -path 'test/generated_migrations/*' \
              -print
          )
          dart format --output=none --set-exit-if-changed "${dart_files[@]}"

      - name: Drift codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Drift schema snapshot
        run: |
          dart run drift_dev schema dump \
            lib/data/local/database/careerspeak_database.dart \
            drift_schemas/drift_schema_v4.json

      - name: Drift migration test codegen
        run: |
          rm -rf test/generated_migrations
          dart run drift_dev schema generate \
            --data-classes \
            --companions \
            drift_schemas/ \
            test/generated_migrations/

      - name: Generated baseline reproducibility
        run: |
          git diff --exit-code -- \
            lib/data/local/database/careerspeak_database.g.dart \
            drift_schemas/drift_schema_v1.json \
            drift_schemas/drift_schema_v2.json \
            drift_schemas/drift_schema_v3.json \
            drift_schemas/drift_schema_v4.json \
            test/generated_migrations

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
