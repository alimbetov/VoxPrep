name: Merge Format Proof

on:
  push:
    branches:
      - feat/universal-vertical-catalogue
    paths:
      - 'mobile/careerspeak_app/test/acceptance/c4_adversarial_atomicity_acceptance_test.dart'
      - '.github/workflows/merge-format-proof.yml'

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/careerspeak_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Show exact formatter diff
        run: |
          dart format test/acceptance/c4_adversarial_atomicity_acceptance_test.dart
          git diff -- test/acceptance/c4_adversarial_atomicity_acceptance_test.dart
