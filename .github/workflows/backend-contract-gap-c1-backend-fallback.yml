name: Backend Contract Gap C1 Backend Fallback Qualification

on:
  push:
    branches: [feat/backend-contract-gap-audit]
    paths:
      - '.github/workflows/backend-contract-gap-c1-backend-fallback.yml'
      - 'tool/c1_backend_fallback_v2_patch.py'
      - 'tool/c1_backend_fallback_v2_test_patch.py'
      - 'tool/c1_schema_v6_retirement_patch.py'
      - 'tool/c1_retirement_migration_max_revision_patch.py'
      - 'tool/c1_retirement_migration_hardening_patch.py'
      - 'tool/c1_locale_policy_repair_marker_patch.py'
      - 'tool/c1_locale_repair_patch.py'
      - 'tool/c1_acceptance_compile_patch.py'
      - 'tool/c1_full_regression_patch.py'
      - 'tool/c1_analyzer_cleanup_patch.py'
      - 'mobile/careerspeak_app/lib/application/content_sync/content_sync_coordinator.dart'
      - 'mobile/careerspeak_app/lib/data/local/database/careerspeak_locale_tables.dart'
      - 'mobile/careerspeak_app/lib/data/local/database/careerspeak_retirement_tables.dart'

concurrency:
  group: backend-contract-gap-c1-final-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  qualify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: mobile/careerspeak_app
        run: flutter pub get

      - name: Apply unified C1 localization and retirement implementation
        run: |
          python3 tool/c1_backend_fallback_v2_patch.py
          python3 tool/c1_backend_fallback_v2_test_patch.py
          python3 tool/c1_schema_v6_retirement_patch.py
          python3 tool/c1_retirement_migration_max_revision_patch.py
          python3 tool/c1_retirement_migration_hardening_patch.py
          python3 tool/c1_locale_policy_repair_marker_patch.py
          python3 tool/c1_locale_repair_patch.py
          python3 tool/c1_acceptance_compile_patch.py
          python3 tool/c1_full_regression_patch.py
          python3 tool/c1_analyzer_cleanup_patch.py

      - name: Format C1 sources
        working-directory: mobile/careerspeak_app
        run: |
          mapfile -t dart_files < <(
            find lib test -type f -name '*.dart' \
              ! -name '*.g.dart' \
              ! -path 'test/generated_migrations/*' \
              -print
          )
          dart format "${dart_files[@]}"

      - name: Generate final Drift v6 baseline
        working-directory: mobile/careerspeak_app
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run drift_dev schema dump \
            lib/data/local/database/careerspeak_database.dart \
            drift_schemas/drift_schema_v6.json
          rm -rf test/generated_migrations
          dart run drift_dev schema generate \
            --data-classes \
            --companions \
            drift_schemas/ \
            test/generated_migrations/

      - name: Analyze
        id: analyze
        continue-on-error: true
        working-directory: mobile/careerspeak_app
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee ../../c1-analyze.log

      - name: Upload analyzer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1-analyzer-diagnostics
          path: c1-analyze.log
          if-no-files-found: error

      - name: Enforce analyzer gate
        if: steps.analyze.outcome == 'failure'
        run: exit 1

      - name: C1 lifecycle qualification
        working-directory: mobile/careerspeak_app
        run: |
          flutter test test/application/content_delivery/locale_fallback_test.dart
          flutter test test/application/content_sync/content_sync_locale_projection_test.dart
          flutter test test/application/content_sync/locale_policy_repair_test.dart
          flutter test test/contracts/backend_owned_locale_fallback_contract_test.dart
          flutter test test/contracts/manifest_contract_fixture_test.dart
          flutter test test/contracts/openapi_contract_baseline_test.dart
          flutter test test/data/local/database/careerspeak_database_test.dart
          flutter test test/data/local/database/careerspeak_database_migration_test.dart
          flutter test test/data/local/database/careerspeak_retirement_migration_test.dart
          flutter test test/data/local/drift_root_fallback_persistence_test.dart
          flutter test test/data/local/drift_localized_content_repository_test.dart
          flutter test test/data/local/drift_locale_fallback_policy_test.dart
          flutter test test/data/local/drift_locale_policy_repair_marker_test.dart
          flutter test test/data/local/drift_sync_locale_repair_test.dart
          flutter test test/acceptance/c1_localization_recovery_acceptance_test.dart
          flutter test test/acceptance/c1_online_sync_offline_reopen_acceptance_test.dart
          flutter test test/acceptance/c1_tombstone_retirement_acceptance_test.dart
          flutter test test/acceptance/c1_locale_offline_restart_acceptance_test.dart
          flutter test test/acceptance/p2_10_7_production_e2e_test.dart

      - name: Full regression suite
        working-directory: mobile/careerspeak_app
        run: flutter test

      - name: Commit qualified C1 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            contracts/learner-api-v1.yaml \
            .github/workflows/flutter-production-adapters.yml \
            mobile/careerspeak_app/lib \
            mobile/careerspeak_app/test \
            mobile/careerspeak_app/drift_schemas
          if git diff --cached --quiet; then
            echo 'No generated or patch-applied changes to commit.'
            exit 0
          fi
          git commit -m 'feat(c1): complete localization and retirement lifecycle'
          git fetch origin feat/backend-contract-gap-audit
          remote_sha="$(git rev-parse origin/feat/backend-contract-gap-audit)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Branch advanced from $GITHUB_SHA to $remote_sha during qualification; refusing stale push."
            exit 1
          fi
          git push origin HEAD:feat/backend-contract-gap-audit
