name: C2 Typed Fixture Repair Once

on:
  push:
    branches:
      - feat/backend-contract-gap-audit
    paths:
      - '.github/workflows/c2-fixture-repair-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Upgrade acceptance backend fixtures to typed C2 payloads
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('mobile/careerspeak_app/test/acceptance/p2_10_7_production_e2e_test.dart'),
              Path('mobile/careerspeak_app/test/acceptance/p2_11_recovery_acceptance_test.dart'),
          ]
          old = """  'minutes': 8,\n  'hasAudio': false,\n};"""
          new = """  'minutes': 8,\n  'hasAudio': false,\n  'skillCodes': <String>['COMMUNICATION', 'SYSTEM_DESIGN'],\n  'body': <String, Object?>{\n    'kind': 'interview',\n    'prompt': 'What is dependency injection?',\n    'modelAnswer':\n        'Dependencies are supplied externally rather than created internally.',\n    'keyPoints': <String>['loose coupling', 'testability'],\n  },\n};"""
          for path in files:
              source = path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one legacy payload block, found {count}')
              path.write_text(source.replace(old, new))
          PY
          dart format \
            mobile/careerspeak_app/test/acceptance/p2_10_7_production_e2e_test.dart \
            mobile/careerspeak_app/test/acceptance/p2_11_recovery_acceptance_test.dart
      - name: Run repaired acceptance tests
        working-directory: mobile/careerspeak_app
        run: |
          flutter pub get
          flutter test \
            test/acceptance/p2_10_7_production_e2e_test.dart \
            test/acceptance/p2_11_recovery_acceptance_test.dart
      - name: Commit typed fixture repair
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            mobile/careerspeak_app/test/acceptance/p2_10_7_production_e2e_test.dart \
            mobile/careerspeak_app/test/acceptance/p2_11_recovery_acceptance_test.dart
          git commit -m 'test(c2): upgrade production fixtures to typed payloads'
          git fetch origin feat/backend-contract-gap-audit
          test "$(git rev-parse origin/feat/backend-contract-gap-audit)" = "$BASE_SHA"
          git push origin HEAD:feat/backend-contract-gap-audit
