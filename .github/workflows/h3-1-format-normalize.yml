name: H3.1 Format Normalize

on:
  push:
    branches:
      - feat/learner-product-ui-v1
    paths:
      - '.github/workflows/h3-1-format-normalize.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/careerspeak_app
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/learner-product-ui-v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Canonical format
        run: |
          dart format \
            lib/app/billing_providers.dart \
            test/app/api_client_providers_test.dart \
            test/app/app_configuration_test.dart \
            test/acceptance/p2_10_7_production_e2e_test.dart

      - name: Commit formatter output when needed
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatter diff.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            mobile/careerspeak_app/lib/app/billing_providers.dart \
            mobile/careerspeak_app/test/app/api_client_providers_test.dart \
            mobile/careerspeak_app/test/app/app_configuration_test.dart \
            mobile/careerspeak_app/test/acceptance/p2_10_7_production_e2e_test.dart
          git commit -m 'style(h3.1): apply canonical Dart formatting'
          git push origin HEAD:feat/learner-product-ui-v1
