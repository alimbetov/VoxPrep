name: C2.3 Format Once

on:
  push:
    branches:
      - feat/backend-contract-gap-audit
    paths:
      - '.github/workflows/c2-3-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Format C2.3 production sources
        run: |
          dart format \
            mobile/careerspeak_app/lib/application/content_delivery/content_payload.dart \
            mobile/careerspeak_app/lib/data/remote/content_payload_decoder.dart \
            mobile/careerspeak_app/lib/data/remote/content_payload_mapper.dart \
            mobile/careerspeak_app/lib/data/remote/dto/content_payload_dto.dart
      - name: Commit formatter-only change
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          if git diff --quiet -- mobile/careerspeak_app/lib; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            mobile/careerspeak_app/lib/application/content_delivery/content_payload.dart \
            mobile/careerspeak_app/lib/data/remote/content_payload_decoder.dart \
            mobile/careerspeak_app/lib/data/remote/content_payload_mapper.dart \
            mobile/careerspeak_app/lib/data/remote/dto/content_payload_dto.dart
          git commit -m 'style(c2): format typed production decode'
          git fetch origin feat/backend-contract-gap-audit
          test "$(git rev-parse origin/feat/backend-contract-gap-audit)" = "$BASE_SHA"
          git push origin HEAD:feat/backend-contract-gap-audit
