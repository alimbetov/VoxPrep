name: C3 Assessment Format Once

on:
  push:
    branches:
      - feat/backend-contract-gap-audit
    paths:
      - '.github/workflows/c3-assessment-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/backend-contract-gap-audit
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: mobile/careerspeak_app
        run: flutter pub get
      - name: Apply official formatter
        working-directory: mobile/careerspeak_app
        run: dart format lib/domain/assessment.dart
      - name: Commit formatter-only repair
        run: |
          if git diff --quiet -- mobile/careerspeak_app/lib/domain/assessment.dart; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/careerspeak_app/lib/domain/assessment.dart
          git commit -m 'style(c3): apply official assessment formatter'
          git push origin HEAD:feat/backend-contract-gap-audit
