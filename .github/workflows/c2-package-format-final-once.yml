name: C2 Package Format Final Once

on:
  push:
    branches:
      - feat/backend-contract-gap-audit
    paths:
      - '.github/workflows/c2-package-format-final-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Resolve package
        working-directory: mobile/careerspeak_app
        run: flutter pub get
      - name: Format in production package context
        working-directory: mobile/careerspeak_app
        run: dart format test/acceptance/p2_11_recovery_acceptance_test.dart
      - name: Commit formatter-only repair
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          if git diff --quiet -- mobile/careerspeak_app/test/acceptance/p2_11_recovery_acceptance_test.dart; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/careerspeak_app/test/acceptance/p2_11_recovery_acceptance_test.dart
          git commit -m 'style(c2): format recovery typed fixture'
          git fetch origin feat/backend-contract-gap-audit
          test "$(git rev-parse origin/feat/backend-contract-gap-audit)" = "$BASE_SHA"
          git push origin HEAD:feat/backend-contract-gap-audit
