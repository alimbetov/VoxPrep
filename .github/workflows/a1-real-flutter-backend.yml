name: A1 Real Flutter Backend Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - feat/a1-real-flutter-backend-acceptance
      - feat/r5-commercial-chain-qualification
  pull_request:
    paths:
      - 'backend/**'
      - 'mobile/careerspeak_app/**'
      - 'infra/**'
      - '.github/workflows/a1-real-flutter-backend.yml'

permissions:
  contents: read

jobs:
  a1-real-flutter-backend:
    name: a1-real-flutter-backend
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Flutter SDK 3.47.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Flutter dependencies and static checks
        working-directory: mobile/careerspeak_app
        run: |
          flutter pub get
          if ! dart format --output=none --set-exit-if-changed lib/data/local/drift_sync_plan_executor.dart test/acceptance/a1_real_backend_flutter_test.dart; then
            dart format --output=write lib/data/local/drift_sync_plan_executor.dart test/acceptance/a1_real_backend_flutter_test.dart
            git --no-pager diff -- lib/data/local/drift_sync_plan_executor.dart test/acceptance/a1_real_backend_flutter_test.dart
            exit 1
          fi
          flutter analyze --no-pub

      - name: Prepare isolated infrastructure secrets
        run: ./infra/scripts/init-secrets.sh test

      - name: Start real PostgreSQL and RustFS
        run: |
          docker compose --env-file infra/env/test.env.example -f infra/compose/compose.test.yml up -d --wait postgres rustfs
          docker compose --env-file infra/env/test.env.example -f infra/compose/compose.test.yml run --rm rustfs-bootstrap

      - name: Live Spring Boot + Flutter A1 and HTTP Media Library R5
        env:
          VOXPREP_SECRET_DIR: ${{ github.workspace }}/infra/secrets/test/backend/
          VOXPREP_DB_URL: jdbc:postgresql://127.0.0.1:55432/voxprep_test
          VOXPREP_STORAGE_ENDPOINT: http://127.0.0.1:19000
          SPRING_PROFILES_ACTIVE: test
        run: |
          mvn -B -ntp -f backend/pom.xml \
            -Dtest=A1RealBackendFlutterAcceptanceTest,R5MediaLibraryLiveHttpAcceptanceTest \
            -Dvoxprep.r5.enabled=true \
            -Dvoxprep.a1.enabled=true \
            -Dvoxprep.a1.flutter.dir=${{ github.workspace }}/mobile/careerspeak_app \
            test

      - name: Capture R1 PostgreSQL publication evidence
        run: |
          mkdir -p backend/target/r1-evidence
          docker compose --env-file infra/env/test.env.example -f infra/compose/compose.test.yml \
            exec -T postgres psql -X -v ON_ERROR_STOP=1 \
            -U voxprep_bootstrap -d voxprep_test \
            < infra/acceptance/r1-publication-evidence.sql \
            > backend/target/r1-evidence/postgres-publication-snapshot.txt
          test -s backend/target/r1-evidence/postgres-publication-snapshot.txt
          grep -q 'evidence_publication_current' backend/target/r1-evidence/postgres-publication-snapshot.txt
          grep -q 'evidence_release_history' backend/target/r1-evidence/postgres-publication-snapshot.txt
          grep -q 'evidence_approved_exact_content_refs' backend/target/r1-evidence/postgres-publication-snapshot.txt
          grep -q 'evidence_immutable_wire_snapshots' backend/target/r1-evidence/postgres-publication-snapshot.txt

      - name: Upload R1 real PostgreSQL and Flutter evidence
        uses: actions/upload-artifact@v4
        with:
          name: r1-real-publication-evidence-${{ github.sha }}
          path: backend/target/r1-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Report infrastructure state on failure
        if: failure()
        run: |
          docker compose --env-file infra/env/test.env.example -f infra/compose/compose.test.yml ps -a || true
          docker compose --env-file infra/env/test.env.example -f infra/compose/compose.test.yml logs --tail=100 postgres rustfs || true

      - name: Cleanup isolated infrastructure
        if: always()
        run: docker compose --env-file infra/env/test.env.example -f infra/compose/compose.test.yml down -v --remove-orphans || true
