name: C2.4 Drift Typed Persistence Once

on:
  push:
    branches:
      - feat/backend-contract-gap-audit
    paths:
      - '.github/workflows/c2-4-drift-once.yml'

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: mobile/careerspeak_app
        run: flutter pub get
      - name: Apply deterministic C2.4 patch
        run: python3 tool/c2_4_patch.py
      - name: Format C2.4 sources
        working-directory: mobile/careerspeak_app
        run: dart format lib test
      - name: Generate Drift v7 baseline
        working-directory: mobile/careerspeak_app
        run: |
          dart run build_runner build
          dart run drift_dev schema dump \
            lib/data/local/database/careerspeak_database.dart \
            drift_schemas/drift_schema_v7.json
          rm -rf test/generated_migrations
          dart run drift_dev schema generate \
            --data-classes \
            --companions \
            drift_schemas/ \
            test/generated_migrations/
      - name: Analyze
        working-directory: mobile/careerspeak_app
        run: flutter analyze
      - name: C2.4 targeted qualification
        working-directory: mobile/careerspeak_app
        run: |
          flutter test \
            test/data/remote/content_payload_decoder_test.dart \
            test/data/local/drift_sync_plan_executor_test.dart \
            test/data/local/database/careerspeak_database_migration_test.dart \
            test/data/local/database/typed_content_read_restart_test.dart
      - name: Full regression suite
        working-directory: mobile/careerspeak_app
        run: flutter test
      - name: Commit qualified C2.4 implementation
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/careerspeak_app
          if git diff --cached --quiet; then
            echo 'No C2.4 implementation changes to commit.'
            exit 1
          fi
          git commit -m 'feat(c2): persist typed content revisions in Drift v7'
          git fetch origin feat/backend-contract-gap-audit
          test "$(git rev-parse origin/feat/backend-contract-gap-audit)" = "$BASE_SHA"
          git push origin HEAD:feat/backend-contract-gap-audit
