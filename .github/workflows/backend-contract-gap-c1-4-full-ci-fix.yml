name: Backend Contract Gap C1.4 Full CI Fix

on:
  push:
    branches: [feat/backend-contract-gap-audit]
    paths: ['.github/workflows/backend-contract-gap-c1-4-full-ci-fix.yml']

permissions:
  contents: write

jobs:
  qualify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: mobile/careerspeak_app
        run: flutter pub get

      - name: Apply contract baseline repair
        run: python3 tool/c1_4_full_ci_fix.py

      - name: Format repaired Dart tests
        working-directory: mobile/careerspeak_app
        run: |
          dart format \
            test/core/motion/careerspeak_motion_test.dart \
            test/acceptance/p2_8_asset_resolution_test.dart \
            test/acceptance/p2_10_7_production_e2e_test.dart \
            test/acceptance/p2_11_recovery_acceptance_test.dart \
            test/data/remote/http_content_manifest_gateway_test.dart \
            test/data/remote/content_manifest_decoder_test.dart

      - name: Analyze
        working-directory: mobile/careerspeak_app
        run: flutter analyze

      - name: Full test suite
        working-directory: mobile/careerspeak_app
        run: flutter test

      - name: Commit qualified baseline repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/careerspeak_app/test
          git commit -m 'test(c1): align suite with locale-independent localization contract'
          git push origin HEAD:feat/backend-contract-gap-audit
