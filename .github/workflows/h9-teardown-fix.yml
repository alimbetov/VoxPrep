name: H9 Teardown Fix

on:
  push:
    branches:
      - feat/learner-product-ui-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/learner-product-ui-v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: mobile/careerspeak_app
        run: flutter pub get

      - name: Fix adversarial teardown ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mobile/careerspeak_app/test/acceptance/content_detail_audio_adversarial_e2e_test.dart')
          text = path.read_text()
          old_registration = 'addTearDown(() => scenario.dispose(tester));'
          if text.count(old_registration) != 4:
              raise SystemExit(f'expected 4 teardown registrations, got {text.count(old_registration)}')
          text = text.replace(old_registration, 'addTearDown(scenario.dispose);')

          old_dispose = '''  Future<void> dispose(WidgetTester tester) async {\n    await tester.pumpWidget(const SizedBox.shrink());\n    await tester.pump();\n    await tester.runAsync(() async {\n      await Future<void>.delayed(const Duration(milliseconds: 20));\n      await learnerState.dispose().timeout(const Duration(seconds: 2));\n      if (await directory.exists()) await directory.delete(recursive: true);\n    });\n  }\n'''
          new_dispose = '''  Future<void> dispose() async {\n    // WidgetTester belongs to the test body. Flutter owns widget-tree teardown;\n    // this fixture only releases resources it created itself. Do not await the\n    // broadcast close here because ProviderScope cancellation is asynchronous.\n    unawaited(learnerState.dispose());\n    if (await directory.exists()) await directory.delete(recursive: true);\n  }\n'''
          if old_dispose not in text:
              raise SystemExit('dispose pattern not found')
          path.write_text(text.replace(old_dispose, new_dispose, 1))
          PY

      - name: Canonical format
        working-directory: mobile/careerspeak_app
        run: dart format test/acceptance/content_detail_audio_adversarial_e2e_test.dart

      - name: Commit H9 fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/careerspeak_app/test/acceptance/content_detail_audio_adversarial_e2e_test.dart
          git commit -m 'test(h9): separate widget and fixture teardown ownership'
          git push origin HEAD:feat/learner-product-ui-v1
