name: Backend Only Media Format Proof

on:
  push:
    branches:
      - feat/universal-vertical-catalogue
    paths:
      - 'mobile/careerspeak_app/test/acceptance/audio_asset_token_recovery_acceptance_test.dart'
      - 'mobile/careerspeak_app/test/architecture/asset_download_boundary_test.dart'
      - '.github/workflows/backend-only-media-format-proof.yml'

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/careerspeak_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Show canonical formatter diff
        run: |
          dart format \
            test/acceptance/audio_asset_token_recovery_acceptance_test.dart \
            test/architecture/asset_download_boundary_test.dart
          git diff -- \
            test/acceptance/audio_asset_token_recovery_acceptance_test.dart \
            test/architecture/asset_download_boundary_test.dart
          git diff --quiet -- \
            test/acceptance/audio_asset_token_recovery_acceptance_test.dart \
            test/architecture/asset_download_boundary_test.dart
