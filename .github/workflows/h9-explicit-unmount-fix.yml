name: H9 Explicit Unmount Fix

on:
  push:
    branches:
      - feat/learner-product-ui-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/learner-product-ui-v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: mobile/careerspeak_app
        run: flutter pub get

      - name: Add explicit widget unmount
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mobile/careerspeak_app/test/acceptance/content_detail_audio_adversarial_e2e_test.dart')
          text = path.read_text()

          pause = "      expect(find.text('Pause'), findsOneWidget);\n    },"
          play = "      expect(find.text('Play'), findsOneWidget);\n    },"
          if text.count(pause) != 2:
              raise SystemExit(f'expected 2 Pause test endings, got {text.count(pause)}')
          if text.count(play) != 2:
              raise SystemExit(f'expected 2 Play test endings, got {text.count(play)}')

          text = text.replace(
              pause,
              "      expect(find.text('Pause'), findsOneWidget);\n      await scenario.unmount(tester);\n    },",
          )
          text = text.replace(
              play,
              "      expect(find.text('Play'), findsOneWidget);\n      await scenario.unmount(tester);\n    },",
          )

          marker = '''  Future<void> dispose() async {\n'''
          method = '''  Future<void> unmount(WidgetTester tester) async {\n    await tester.pumpWidget(const SizedBox.shrink());\n    await tester.pump();\n    await tester.runAsync(\n      () => Future<void>.delayed(const Duration(milliseconds: 20)),\n    );\n  }\n\n'''
          if marker not in text:
              raise SystemExit('dispose marker not found')
          text = text.replace(marker, method + marker, 1)
          path.write_text(text)
          PY

      - name: Canonical format
        working-directory: mobile/careerspeak_app
        run: dart format test/acceptance/content_detail_audio_adversarial_e2e_test.dart

      - name: Commit H9 fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/careerspeak_app/test/acceptance/content_detail_audio_adversarial_e2e_test.dart
          git commit -m 'test(h9): explicitly unmount adversarial audio widgets'
          git push origin HEAD:feat/learner-product-ui-v1
