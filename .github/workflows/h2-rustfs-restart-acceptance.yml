name: H2 RustFS Restart Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "infra/compose/compose.test.yml"
      - "infra/rustfs/**"
      - ".github/workflows/h2-rustfs-restart-acceptance.yml"

permissions:
  contents: read

jobs:
  rustfs-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Generate isolated TEST secrets
        run: ./infra/scripts/init-secrets.sh test

      - name: Start PostgreSQL and RustFS
        run: |
          docker compose --env-file infra/env/test.env.example \
            -f infra/compose/compose.test.yml up -d --wait postgres rustfs
          docker compose --env-file infra/env/test.env.example \
            -f infra/compose/compose.test.yml run --rm rustfs-bootstrap

      - name: Seed interrupted REGISTERED upload in real RustFS
        env: &backend-env
          VOXPREP_SECRET_DIR: ${{ github.workspace }}/infra/secrets/test/backend/
          VOXPREP_DB_URL: jdbc:postgresql://127.0.0.1:55432/voxprep_test
          VOXPREP_STORAGE_ENDPOINT: http://127.0.0.1:19000
          SPRING_PROFILES_ACTIVE: test
        run: >-
          mvn -B -ntp -f backend/pom.xml
          -Dh2.restart.acceptance=true
          -Dtest=RustFsRestartAcceptanceTest#seedObjectAndLeaveRegistered test

      - name: Kill RustFS container
        run: |
          docker compose --env-file infra/env/test.env.example \
            -f infra/compose/compose.test.yml kill -s SIGKILL rustfs

      - name: Confirm recovery is fail-closed while RustFS is unavailable
        env: *backend-env
        run: >-
          mvn -B -ntp -f backend/pom.xml
          -Dh2.restart.acceptance=true
          -Dtest=RustFsRestartAcceptanceTest#outageLeavesRegistered test

      - name: Restart RustFS without erasing persisted objects
        run: |
          docker compose --env-file infra/env/test.env.example \
            -f infra/compose/compose.test.yml up -d --wait rustfs

      - name: Reconcile after restart and verify idempotency
        env: *backend-env
        run: >-
          mvn -B -ntp -f backend/pom.xml
          -Dh2.restart.acceptance=true
          -Dtest=RustFsRestartAcceptanceTest#restartRecoversReady test

      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose --env-file infra/env/test.env.example \
            -f infra/compose/compose.test.yml ps -a || true
          docker compose --env-file infra/env/test.env.example \
            -f infra/compose/compose.test.yml logs postgres rustfs || true

      - name: Cleanup
        if: always()
        run: |
          docker compose --env-file infra/env/test.env.example \
            -f infra/compose/compose.test.yml down -v --remove-orphans || true
