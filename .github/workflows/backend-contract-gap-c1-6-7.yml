name: Backend Contract Gap C1.6-C1.7 Qualification

on:
  push:
    branches: [feat/backend-contract-gap-audit]
    paths:
      - '.github/workflows/backend-contract-gap-c1-6-7.yml'
      - 'tool/c1_6_c1_7_patch.py'
      - 'mobile/careerspeak_app/test/acceptance/c1_localization_recovery_acceptance_test.dart'

permissions:
  contents: write

jobs:
  qualify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: mobile/careerspeak_app
        run: flutter pub get
      - name: Apply C1.6 no-resurrection hardening
        run: python3 tool/c1_6_c1_7_patch.py
      - name: Format changed Dart sources
        working-directory: mobile/careerspeak_app
        run: |
          dart format \
            lib/data/local/drift_sync_plan_executor.dart \
            test/data/local/drift_sync_plan_executor_test.dart \
            test/acceptance/c1_localization_recovery_acceptance_test.dart
      - name: Analyze
        working-directory: mobile/careerspeak_app
        run: flutter analyze
      - name: C1 localization lifecycle qualification
        working-directory: mobile/careerspeak_app
        run: |
          flutter test test/data/local/drift_localized_content_repository_test.dart
          flutter test test/data/local/drift_sync_plan_executor_test.dart
          flutter test test/acceptance/c1_localization_recovery_acceptance_test.dart
      - name: Full regression suite
        working-directory: mobile/careerspeak_app
        run: flutter test
      - name: Commit qualified production hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            mobile/careerspeak_app/lib/data/local/drift_sync_plan_executor.dart \
            mobile/careerspeak_app/test/data/local/drift_sync_plan_executor_test.dart \
            mobile/careerspeak_app/test/acceptance/c1_localization_recovery_acceptance_test.dart
          if git diff --cached --quiet; then
            echo 'No production changes to commit.'
            exit 0
          fi
          git commit -m 'feat(c1): prevent tombstoned content resurrection'
          git fetch origin feat/backend-contract-gap-audit
          git rebase origin/feat/backend-contract-gap-audit
          git push origin HEAD:feat/backend-contract-gap-audit
