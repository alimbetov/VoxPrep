name: Backend Contract Gap Dart Formatter

on:
  push:
    branches:
      - feat/backend-contract-gap-audit
    paths:
      - 'mobile/careerspeak_app/**/*.dart'
      - '.github/workflows/backend-contract-gap-format.yml'

permissions:
  contents: write

concurrency:
  group: backend-contract-gap-format
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/careerspeak_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Format handwritten Dart
        run: |
          mapfile -t dart_files < <(
            find lib test -type f -name '*.dart' \
              ! -name '*.g.dart' \
              ! -path 'test/generated_migrations/*' \
              -print
          )
          dart format "${dart_files[@]}"

      - name: Commit formatter output
        run: |
          if git diff --quiet -- lib test; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          git commit -m 'style(c1): apply Dart formatter'
          git push origin HEAD:feat/backend-contract-gap-audit
