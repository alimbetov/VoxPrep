name: Learner Product UI Canonical Format

on:
  push:
    branches:
      - feat/learner-product-ui-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonical-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/learner-product-ui-v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: mobile/careerspeak_app
        run: flutter pub get

      - name: Canonical Dart format
        working-directory: mobile/careerspeak_app
        run: dart format lib test

      - name: Commit canonical format
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/careerspeak_app/lib mobile/careerspeak_app/test
          if git diff --cached --quiet; then
            echo 'No canonical formatting changes required.'
            exit 0
          fi
          git commit -m 'style(hardening): canonicalize Dart package format'
          git push origin HEAD:feat/learner-product-ui-v1
