name: TTS Worker Foundation

on:
  push:
    branches:
      - feat/tts-worker-foundation
    paths:
      - "worker/**"
      - ".github/workflows/tts-worker-foundation.yml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/tts-worker-foundation.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml

      - name: Install worker and test dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run worker tests
        run: pytest

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build worker image
        run: docker build -t voxprep-tts-worker:w1 ./worker

      - name: Missing configuration fails fast
        shell: bash
        run: |
          set +e
          docker run --rm voxprep-tts-worker:w1 >/tmp/worker.out 2>/tmp/worker.err
          code=$?
          set -e
          cat /tmp/worker.err
          test "$code" -eq 2
          grep -q "BASE_URL is required" /tmp/worker.err

      - name: Valid runtime starts and stops with SIGTERM
        shell: bash
        run: |
          token="ci-worker-secret"
          id=$(docker run -d --rm \
            -e BASE_URL=http://backend.example \
            -e WORKER_TOKEN="$token" \
            -e WORKER_ID=ci-worker-01 \
            voxprep-tts-worker:w1)
          sleep 2
          docker stop --time 10 "$id"
          docker logs "$id" > /tmp/worker.log 2>&1 || true
          if grep -Fq "$token" /tmp/worker.log; then
            echo "worker token leaked to logs"
            exit 1
          fi
