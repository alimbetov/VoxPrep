name: Backend Contract Gap C1.4 Full Suite Fix

on:
  push:
    branches: [feat/backend-contract-gap-audit]
    paths: ['.github/workflows/backend-contract-gap-c1-4-suite-fix.yml']

permissions:
  contents: write

jobs:
  qualify-and-commit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - working-directory: mobile/careerspeak_app
        run: flutter pub get
      - name: Apply stale-fixture fixes
        run: python3 tool/c1_4_full_suite_fix.py
      - name: Format and analyze
        working-directory: mobile/careerspeak_app
        run: |
          mapfile -t dart_files < <(find test -type f -name '*.dart' ! -name '*.g.dart' ! -path 'test/generated_migrations/*' -print)
          dart format "${dart_files[@]}"
          flutter analyze
      - name: Regression tests
        working-directory: mobile/careerspeak_app
        run: |
          flutter test test/core/motion/careerspeak_motion_test.dart
          flutter test test/acceptance/p2_8_asset_resolution_test.dart
          flutter test test/acceptance/p2_10_7_production_e2e_test.dart
          flutter test test/acceptance/p2_11_recovery_acceptance_test.dart
          flutter test test/contracts/manifest_contract_fixture_test.dart
          flutter test test/data/remote/http_content_manifest_gateway_test.dart
          flutter test test/data/remote/content_manifest_decoder_test.dart
          flutter test
      - name: Commit qualified test alignment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/careerspeak_app/test
          git commit -m 'test(c1): align fixtures with localization contract'
          git push origin HEAD:feat/backend-contract-gap-audit
