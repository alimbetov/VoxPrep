name: B1 Backend Foundation Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "infra/compose/compose.test.yml"
      - "infra/env/test.env.example"
      - "infra/postgres/init/00-bootstrap.sh"
      - "infra/rustfs/bootstrap/bootstrap.sh"
      - "infra/rustfs/policies/backend-rw.json"
      - "infra/scripts/init-secrets.sh"
      - ".github/workflows/b1-backend-foundation.yml"
  pull_request:
    paths:
      - "backend/**"
      - "infra/compose/compose.test.yml"
      - "infra/env/test.env.example"
      - "infra/postgres/init/00-bootstrap.sh"
      - "infra/rustfs/bootstrap/bootstrap.sh"
      - "infra/rustfs/policies/backend-rw.json"
      - "infra/scripts/init-secrets.sh"
      - ".github/workflows/b1-backend-foundation.yml"

permissions:
  contents: read

jobs:
  backend-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Generate isolated TEST secrets
        run: ./infra/scripts/init-secrets.sh test

      - name: Validate TEST Compose model
        run: |
          docker compose \
            --env-file infra/env/test.env.example \
            -f infra/compose/compose.test.yml \
            config --quiet

      - name: Start PostgreSQL and RustFS
        run: |
          docker compose \
            --env-file infra/env/test.env.example \
            -f infra/compose/compose.test.yml \
            up -d --wait postgres rustfs

      - name: Bootstrap RustFS
        run: |
          docker compose \
            --env-file infra/env/test.env.example \
            -f infra/compose/compose.test.yml \
            run --rm rustfs-bootstrap

      - name: Build and run Backend foundation acceptance
        env:
          VOXPREP_SECRET_DIR: ${{ github.workspace }}/infra/secrets/test/backend/
          VOXPREP_DB_URL: jdbc:postgresql://127.0.0.1:55432/voxprep_test
          VOXPREP_STORAGE_ENDPOINT: http://127.0.0.1:19000
          SPRING_PROFILES_ACTIVE: test
        run: mvn -B -ntp -f backend/pom.xml verify

      - name: Show service state on failure
        if: failure()
        run: |
          docker compose \
            --env-file infra/env/test.env.example \
            -f infra/compose/compose.test.yml \
            ps -a || true
          docker compose \
            --env-file infra/env/test.env.example \
            -f infra/compose/compose.test.yml \
            logs postgres rustfs || true

      - name: Cleanup
        if: always()
        run: |
          docker compose \
            --env-file infra/env/test.env.example \
            -f infra/compose/compose.test.yml \
            down -v --remove-orphans || true
