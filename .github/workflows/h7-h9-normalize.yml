name: H7 H9 Normalize

on:
  push:
    branches:
      - feat/learner-product-ui-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/learner-product-ui-v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: mobile/careerspeak_app
        run: flutter pub get

      - name: Apply bounded H9 teardown and legacy H7 fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          audio = Path('mobile/careerspeak_app/test/acceptance/content_detail_audio_adversarial_e2e_test.dart')
          text = audio.read_text()
          old = """    await tester.runAsync(\n      () => Future<void>.delayed(const Duration(milliseconds: 20)),\n    );\n    await learnerState.dispose();\n    if (await directory.exists()) await directory.delete(recursive: true);\n"""
          new = """    await tester.runAsync(() async {\n      await Future<void>.delayed(const Duration(milliseconds: 20));\n      await learnerState.dispose().timeout(const Duration(seconds: 2));\n      if (await directory.exists()) await directory.delete(recursive: true);\n    });\n"""
          if old not in text:
              raise SystemExit('H9 teardown pattern not found')
          audio.write_text(text.replace(old, new, 1))

          stager = Path('mobile/careerspeak_app/lib/data/local/drift_publication_snapshot_stager.dart')
          text = stager.read_text()
          old = '        packManifests: exactPackManifests,\n'
          new = '        packManifests: _manifestGateway == null ? null : exactPackManifests,\n'
          if old not in text:
              raise SystemExit('H7 pack-manifest fallback pattern not found')
          stager.write_text(text.replace(old, new, 1))
          PY

      - name: Canonical Dart format
        working-directory: mobile/careerspeak_app
        run: dart format lib test

      - name: Commit normalized repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/careerspeak_app/lib mobile/careerspeak_app/test
          if git diff --cached --quiet; then
            echo 'No normalization changes required.'
            exit 0
          fi
          git commit -m 'style(hardening): normalize H7 H9 repairs'
          git push origin HEAD:feat/learner-product-ui-v1
