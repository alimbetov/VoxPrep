name: Backend Contract Gap C1.4 Verify

on:
  push:
    branches:
      - feat/backend-contract-gap-audit
    paths:
      - '.github/workflows/backend-contract-gap-c1-4-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: mobile/careerspeak_app
        run: flutter pub get
      - name: Apply C1.4 patch and fixes
        run: |
          python3 tool/c1_4_patch.py
          python3 tool/c1_4_fix.py
      - name: Format
        working-directory: mobile/careerspeak_app
        run: |
          mapfile -t dart_files < <(find lib test -type f -name '*.dart' ! -name '*.g.dart' ! -path 'test/generated_migrations/*' -print)
          dart format "${dart_files[@]}"
          git diff --check
      - name: Generate Drift v5
        working-directory: mobile/careerspeak_app
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run drift_dev schema dump lib/data/local/database/careerspeak_database.dart drift_schemas/drift_schema_v5.json
          rm -rf test/generated_migrations
          dart run drift_dev schema generate --data-classes --companions drift_schemas/ test/generated_migrations/
      - name: Analyze
        working-directory: mobile/careerspeak_app
        run: flutter analyze
      - name: Targeted tests
        working-directory: mobile/careerspeak_app
        run: |
          flutter test test/data/remote/localized_content_payload_decoder_test.dart
          flutter test test/data/remote/http_localized_content_payload_gateway_test.dart
          flutter test test/data/local/database/careerspeak_database_test.dart
          flutter test test/data/local/drift_sync_plan_executor_test.dart
          flutter test test/contracts/openapi_contract_baseline_test.dart
      - name: Capture C1.4 patch
        run: |
          git diff --binary > c1_4.patch
      - uses: actions/upload-artifact@v4
        with:
          name: c1-4-qualified-patch
          path: c1_4.patch
          if-no-files-found: error
