name: Flutter Mock UI

on:
  push:
    branches:
      - feat/p1-flutter-mock-ui
    paths:
      - 'mobile/careerspeak_app/**'
      - '.github/workflows/flutter-mock-ui.yml'
  pull_request:
    paths:
      - 'mobile/careerspeak_app/**'
      - '.github/workflows/flutter-mock-ui.yml'

concurrency:
  group: flutter-mock-ui-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/careerspeak_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Core P2.10.7 acceptance
        shell: bash
        run: |
          set -euo pipefail
          timeout 2m flutter test \
            test/acceptance/p2_10_7_production_e2e_test.dart \
            --plain-name 'fresh install sync survives file-backed reopen' \
            --reporter expanded
          timeout 2m flutter test \
            test/acceptance/p2_10_7_production_e2e_test.dart \
            --plain-name 'production learner UI renders synchronized Drift content' \
            --reporter expanded

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          # The renderer-snapshot scenario is qualified separately. Keep the
          # blocking suite bounded to core unit/integration/acceptance tests.
          mapfile -t test_files < <(
            find test -type f -name '*_test.dart' \
              ! -path 'test/acceptance/p2_10_7_production_e2e_test.dart' \
              | sort
          )
          if (( ${#test_files[@]} == 0 )); then
            echo 'No core tests discovered.' >&2
            exit 1
          fi
          timeout 12m flutter test \
            "${test_files[@]}" \
            --concurrency=1 \
            --reporter expanded
