name: Flutter Mock UI

on:
  push:
    branches:
      - feat/p1-flutter-mock-ui
    paths:
      - 'mobile/careerspeak_app/**'
      - '.github/workflows/flutter-mock-ui.yml'
  pull_request:
    paths:
      - 'mobile/careerspeak_app/**'
      - '.github/workflows/flutter-mock-ui.yml'

concurrency:
  group: flutter-mock-ui-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/careerspeak_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          # Do not allow a leaked timer/stream or platform wait to keep the PR
          # pending indefinitely. Sequential expanded output identifies the
          # exact last test if the suite hits the bound.
          timeout 12m flutter test --concurrency=1 --reporter expanded
