name: H9 Final Test Harness Fix

on:
  push:
    branches:
      - feat/learner-product-ui-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/careerspeak_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/learner-product-ui-v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Repair adversarial audio UI polling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/acceptance/content_detail_audio_adversarial_e2e_test.dart')
          text = path.read_text()

          old = '''  for (var attempt = 0; attempt < maxPumps; attempt += 1) {\n    await tester.pump(const Duration(milliseconds: 10));\n    if (finder.evaluate().isNotEmpty) return;\n  }'''
          new = '''  for (var attempt = 0; attempt < maxPumps; attempt += 1) {\n    await tester.runAsync(\n      () => Future<void>.delayed(const Duration(milliseconds: 10)),\n    );\n    await tester.pump();\n    if (finder.evaluate().isNotEmpty) return;\n  }'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one _pumpUntilVisible loop, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Canonical format
        run: dart format test/acceptance/content_detail_audio_adversarial_e2e_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Qualify H9 before commit
        run: |
          timeout 90s flutter test \
            test/acceptance/content_detail_audio_redownload_e2e_test.dart \
            test/acceptance/content_detail_audio_adversarial_e2e_test.dart \
            --reporter expanded

      - name: Commit fix
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/careerspeak_app/test/acceptance/content_detail_audio_adversarial_e2e_test.dart
          git commit -m 'test(h9): let audio UI polling advance real async work'
          git push origin HEAD:feat/learner-product-ui-v1
