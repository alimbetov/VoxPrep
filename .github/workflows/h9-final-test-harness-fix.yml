name: H9 Final Test Harness Fix

on:
  push:
    branches:
      - feat/learner-product-ui-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/careerspeak_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/learner-product-ui-v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Repair adversarial audio test harness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/acceptance/content_detail_audio_adversarial_e2e_test.dart')
          text = path.read_text()

          old_checksum = '''      await _pumpUntilVisible(tester, find.textContaining('checksum'));\n\n      expect(scenario.source.openCount, 1);\n      expect(scenario.engine.openCount, 0);\n      expect(find.textContaining('checksum'), findsWidgets);\n      expect(find.text('Play'), findsOneWidget);'''
          new_checksum = '''      await _pumpUntilVisible(tester, find.textContaining('checksum'));\n      await _pumpUntilVisible(\n        tester,\n        find.widgetWithText(FilledButton, 'Play'),\n      );\n\n      expect(scenario.source.openCount, 1);\n      expect(scenario.engine.openCount, 0);\n      expect(find.textContaining('checksum'), findsWidgets);\n      expect(find.text('Play'), findsOneWidget);'''
          if text.count(old_checksum) != 1:
              raise SystemExit('checksum assertion block not found exactly once')
          text = text.replace(old_checksum, new_checksum, 1)

          old_dispose = '''  @override\n  Future<void> dispose() async => _events.close();'''
          new_dispose = '''  @override\n  Future<void> dispose() async {\n    // The controller already cancels its event subscription before dispose.\n    // Do not block the widget fake-async zone waiting for broadcast close.\n    unawaited(_events.close());\n  }'''
          if text.count(old_dispose) != 1:
              raise SystemExit('fake playback dispose not found exactly once')
          text = text.replace(old_dispose, new_dispose, 1)

          path.write_text(text)
          PY

      - name: Canonical format
        run: dart format test/acceptance/content_detail_audio_adversarial_e2e_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Qualify H9 before commit
        run: |
          timeout 90s flutter test \
            test/acceptance/content_detail_audio_redownload_e2e_test.dart \
            test/acceptance/content_detail_audio_adversarial_e2e_test.dart \
            --reporter expanded

      - name: Commit fix
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/careerspeak_app/test/acceptance/content_detail_audio_adversarial_e2e_test.dart
          git commit -m 'test(h9): align adversarial audio fake lifecycle'
          git push origin HEAD:feat/learner-product-ui-v1
