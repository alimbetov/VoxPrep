name: H9 Temp Directory Fix

on:
  push:
    branches:
      - feat/learner-product-ui-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/learner-product-ui-v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: mobile/careerspeak_app
        run: flutter pub get

      - name: Move temp directory creation into real async zone
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mobile/careerspeak_app/test/acceptance/content_detail_audio_adversarial_e2e_test.dart')
          text = path.read_text()

          plain = 'final scenario = await _Scenario.create();'
          if text.count(plain) != 3:
              raise SystemExit(f'expected 3 plain create calls, got {text.count(plain)}')
          text = text.replace(plain, 'final scenario = await _Scenario.create(tester);')

          with_bytes = 'final scenario = await _Scenario.create(sourceBytes: _badBytes);'
          if text.count(with_bytes) != 1:
              raise SystemExit(f'expected 1 sourceBytes create call, got {text.count(with_bytes)}')
          text = text.replace(
              with_bytes,
              'final scenario = await _Scenario.create(tester, sourceBytes: _badBytes);',
              1,
          )

          old_signature = 'static Future<_Scenario> create({List<int> sourceBytes = _goodBytes}) async {'
          new_signature = '''static Future<_Scenario> create(\n    WidgetTester tester, {\n    List<int> sourceBytes = _goodBytes,\n  }) async {'''
          if text.count(old_signature) != 1:
              raise SystemExit('create signature not found exactly once')
          text = text.replace(old_signature, new_signature, 1)

          old_directory = '''    final directory = await Directory.systemTemp.createTemp(\n      'careerspeak-content-detail-audio-adversarial-',\n    );'''
          new_directory = '''    final directory = (await tester.runAsync(\n      () => Directory.systemTemp.createTemp(\n        'careerspeak-content-detail-audio-adversarial-',\n      ),\n    ))!;'''
          if text.count(old_directory) != 1:
              raise SystemExit('temp directory creation not found exactly once')
          text = text.replace(old_directory, new_directory, 1)

          path.write_text(text)
          PY

      - name: Canonical format
        working-directory: mobile/careerspeak_app
        run: dart format test/acceptance/content_detail_audio_adversarial_e2e_test.dart

      - name: Remove diagnostic helper and commit fix
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/h9-first-case-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/careerspeak_app/test/acceptance/content_detail_audio_adversarial_e2e_test.dart
          git commit -m 'test(h9): create adversarial temp directory in real async zone'
          git push origin HEAD:feat/learner-product-ui-v1
