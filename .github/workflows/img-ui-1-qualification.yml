name: IMG-UI.1 Content Cover Qualification

on:
  push:
    branches:
      - feat/content-cover-ui-hardening
    paths:
      - 'mobile/careerspeak_app/**'
      - 'contracts/**'
      - 'docs/implementation/IMG_UI_1_CONTENT_COVER.md'
      - 'docs/implementation/P2_8_ASSET_RESOLVER.md'
      - '.github/workflows/img-ui-1-qualification.yml'
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: mobile/careerspeak_app
        run: flutter pub get
      - name: Format
        working-directory: mobile/careerspeak_app
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        working-directory: mobile/careerspeak_app
        run: flutter analyze
      - name: Full test suite
        working-directory: mobile/careerspeak_app
        run: flutter test

  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: mobile/careerspeak_app
        run: flutter pub get
      - name: IMG-UI.1 resolver qualification
        working-directory: mobile/careerspeak_app
        run: flutter test test/application/content_delivery/content_cover_resolver_test.dart
      - name: IMG-UI.1 widget corruption qualification
        working-directory: mobile/careerspeak_app
        run: flutter test test/features/shared/content_cover_test.dart
