name: B8 Real Backend Worker Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - feat/b1-infrastructure-bootstrap
    paths:
      - "backend/**"
      - "worker/**"
      - "infra/**"
      - ".github/workflows/b8-real-tts-acceptance.yml"
  pull_request:
    paths:
      - "backend/**"
      - "worker/**"
      - "infra/**"
      - ".github/workflows/b8-real-tts-acceptance.yml"

permissions:
  contents: read

jobs:
  real-tts-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Execute A01-A11 real Piper acceptance
        run: bash infra/acceptance/b8-real-tts.sh

      - name: Show diagnostics on failure
        if: failure()
        run: |
          cat .tmp/b8-real-tts/backend.log 2>/dev/null || true
          cat .tmp/b8-real-tts/worker.log 2>/dev/null || true
          docker ps -a || true
          docker compose \
            --env-file infra/env/test.env.example \
            -f infra/compose/compose.test.yml \
            logs postgres rustfs || true

      - name: Cleanup
        if: always()
        run: |
          docker ps -aq --filter ancestor=voxprep-tts-worker:b8 | xargs -r docker rm -f || true
          docker compose \
            --env-file infra/env/test.env.example \
            -f infra/compose/compose.test.yml \
            down -v --remove-orphans || true
