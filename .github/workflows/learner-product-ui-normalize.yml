name: Learner Product UI Normalize

on:
  push:
    branches:
      - feat/learner-product-ui-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/learner-product-ui-v1
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Restore production-compatible P2.8 fixture
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 894cf1bc8e4f17beef14a1d2c9e919a1133e022f
          git show 894cf1bc8e4f17beef14a1d2c9e919a1133e022f:mobile/careerspeak_app/test/acceptance/p2_8_asset_resolution_test.dart \
            > mobile/careerspeak_app/test/acceptance/p2_8_asset_resolution_test.dart
          sed -i 's/expect(database.schemaVersion, 8);/expect(database.schemaVersion, 18);/' \
            mobile/careerspeak_app/test/acceptance/p2_8_asset_resolution_test.dart
          grep -q 'expect(database.schemaVersion, 18);' \
            mobile/careerspeak_app/test/acceptance/p2_8_asset_resolution_test.dart

      - name: Canonical Dart format
        working-directory: mobile/careerspeak_app
        run: dart format lib test

      - name: Commit normalized fixtures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/careerspeak_app/lib mobile/careerspeak_app/test
          if git diff --cached --quiet; then
            echo 'No normalization changes required.'
            exit 0
          fi
          git commit -m 'style(hardening): normalize repaired acceptance fixtures'
          git push origin HEAD:feat/learner-product-ui-v1
