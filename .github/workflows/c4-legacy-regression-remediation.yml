name: C4 Legacy Regression Remediation

on:
  push:
    branches:
      - feat/backend-contract-gap-audit
    paths:
      - '.github/workflows/c4-legacy-regression-remediation.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/backend-contract-gap-audit
          fetch-depth: 0
      - name: Update legacy C4 fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          coordinator = Path('mobile/careerspeak_app/test/application/content_sync/content_sync_coordinator_test.dart')
          text = coordinator.read_text()
          old = "manifest: manifest(108, packs: <PackRevisionRef>[p]),\n          etag: 'e',"
          new = "manifest: manifest(108, packs: <PackRevisionRef>[p]),\n          etag: 'etag-108',"
          if old not in text:
              raise SystemExit('coordinator legacy ETag fragment not found')
          coordinator.write_text(text.replace(old, new, 1))

          for name in [
              'mobile/careerspeak_app/test/acceptance/p2_10_7_production_e2e_test.dart',
              'mobile/careerspeak_app/test/acceptance/p2_11_recovery_acceptance_test.dart',
          ]:
              path = Path(name)
              text = path.read_text()
              marker = "  'tombstones': <Object?>[],"
              if marker not in text:
                  raise SystemExit(f'root tombstone marker not found in {name}')
              replacement = "  'practiceTests': <Object?>[],\n  'catalogues': <Object?>[],\n" + marker
              path.write_text(text.replace(marker, replacement, 1))
          PY
      - name: Commit remediation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/careerspeak_app/test/application/content_sync/content_sync_coordinator_test.dart \
                  mobile/careerspeak_app/test/acceptance/p2_10_7_production_e2e_test.dart \
                  mobile/careerspeak_app/test/acceptance/p2_11_recovery_acceptance_test.dart
          git diff --cached --exit-code && exit 0
          git commit -m 'test(c4): align legacy roots with publication contract'
          git push origin HEAD:feat/backend-contract-gap-audit
