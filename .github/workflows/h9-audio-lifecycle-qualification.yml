name: H9 Audio Lifecycle Qualification

on:
  push:
    branches:
      - feat/learner-product-ui-v1
  workflow_dispatch:

jobs:
  h9:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: mobile/careerspeak_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format H9 slice
        run: >-
          dart format --output=none --set-exit-if-changed
          test/acceptance/content_detail_audio_redownload_e2e_test.dart
          test/acceptance/content_detail_audio_adversarial_e2e_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Audio lifecycle qualification
        run: >-
          timeout 4m flutter test
          test/acceptance/content_detail_audio_redownload_e2e_test.dart
          test/acceptance/content_detail_audio_adversarial_e2e_test.dart
          --reporter expanded
