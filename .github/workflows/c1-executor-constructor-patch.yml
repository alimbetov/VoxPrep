name: C1 Executor Constructor Patch

on:
  push:
    branches: [feat/backend-contract-gap-audit]
    paths: ['.github/workflows/c1-executor-constructor-patch.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch public localized payload gateway parameter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('mobile/careerspeak_app/lib/data/local/drift_sync_plan_executor.dart')
          text = path.read_text()
          old = """    this._payloadGateway, {
              this._localizedPayloadGateway,
              DateTime Function()? now,
            }) : _now = now ?? (() => DateTime.now().toUtc());"""
          new = """    this._payloadGateway, {
              LocalizedContentPayloadGateway? localizedPayloadGateway,
              DateTime Function()? now,
            }) : _localizedPayloadGateway = localizedPayloadGateway,
                 _now = now ?? (() => DateTime.now().toUtc());"""
          if old not in text:
              raise SystemExit('executor constructor anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit source patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/careerspeak_app/lib/data/local/drift_sync_plan_executor.dart
          git commit -m 'fix(c1): expose localized payload gateway to composition root'
          git push origin HEAD:feat/backend-contract-gap-audit
