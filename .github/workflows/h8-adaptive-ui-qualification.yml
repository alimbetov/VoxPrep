name: H8 Adaptive UI Qualification

on:
  push:
    branches:
      - feat/learner-product-ui-v1
  workflow_dispatch:

jobs:
  h8:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/careerspeak_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format H8 slice
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/core/adaptive/careerspeak_adaptive_scaffold.dart
          test/core/adaptive/careerspeak_adaptive_scaffold_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Adaptive navigation qualification
        run: >-
          timeout 4m flutter test
          test/core/adaptive/window_size_class_test.dart
          test/core/adaptive/careerspeak_adaptive_scaffold_test.dart
          --reporter expanded
