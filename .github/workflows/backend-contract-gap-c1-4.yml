name: Backend Contract Gap C1.4 Qualification

on:
  push:
    branches:
      - feat/backend-contract-gap-audit
    paths:
      - '.github/workflows/backend-contract-gap-c1-4.yml'

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: mobile/careerspeak_app
        run: flutter pub get

      - name: Apply C1.4 source patch
        run: python3 tool/c1_4_patch.py

      - name: Format handwritten Dart
        working-directory: mobile/careerspeak_app
        run: |
          mapfile -t dart_files < <(find lib test -type f -name '*.dart' ! -name '*.g.dart' ! -path 'test/generated_migrations/*' -print)
          dart format "${dart_files[@]}"

      - name: Generate Drift v5 artifacts
        working-directory: mobile/careerspeak_app
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run drift_dev schema dump lib/data/local/database/careerspeak_database.dart drift_schemas/drift_schema_v5.json
          rm -rf test/generated_migrations
          dart run drift_dev schema generate --data-classes --companions drift_schemas/ test/generated_migrations/

      - name: Analyze
        working-directory: mobile/careerspeak_app
        run: flutter analyze

      - name: Targeted tests
        working-directory: mobile/careerspeak_app
        run: |
          flutter test test/data/remote/localized_content_payload_decoder_test.dart test/data/remote/http_localized_content_payload_gateway_test.dart test/data/local/database/careerspeak_database_test.dart

      - name: Commit qualified C1.4 implementation
        run: |
          rm -f tool/c1_4_patch.py .github/workflows/backend-contract-gap-c1-4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(c1): persist exact localized payloads in Drift'
          git push origin HEAD:feat/backend-contract-gap-audit
