name: C4 Branch Formatter

on:
  push:
    branches:
      - feat/backend-contract-gap-audit
      - feat/universal-vertical-catalogue
    paths:
      - 'mobile/careerspeak_app/lib/**/*.dart'
      - 'mobile/careerspeak_app/test/**/*.dart'
      - '.github/workflows/c4-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: mobile/careerspeak_app
        run: flutter pub get
      - name: Format Dart sources
        working-directory: mobile/careerspeak_app
        run: dart format lib test
      - name: Commit formatting
        run: |
          if git diff --quiet -- mobile/careerspeak_app/lib mobile/careerspeak_app/test; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/careerspeak_app/lib mobile/careerspeak_app/test
          git commit -m 'style: apply canonical dart format'
          git push origin HEAD:${GITHUB_REF_NAME}
