name: P2.10.7 Fixture Fix

on:
  push:
    branches:
      - feat/learner-product-ui-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/careerspeak_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/learner-product-ui-v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Repair P2.10.7 production fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/acceptance/p2_10_7_production_e2e_test.dart')
          text = path.read_text()

          old_root = "'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'"
          new_root = "'e0bb83877e16655a6b9a649f31d1d727abafe82623fec74f21e5a5a9a215372f'"
          old_pack = "'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'"
          new_pack = "'6945dc3f01162e5e3bf39cc7a2553b2aeb4da712fe330c7ad8d881e558b0c09d'"

          if text.count(old_root) != 1:
              raise SystemExit(f'expected one stale root checksum, got {text.count(old_root)}')
          if text.count(old_pack) != 1:
              raise SystemExit(f'expected one stale pack checksum, got {text.count(old_pack)}')

          text = text.replace(old_root, new_root, 1)
          text = text.replace(old_pack, new_pack, 1)

          import_anchor = "import 'package:careerspeak_app/app/application_bootstrap_providers.dart';\n"
          asset_import = "import 'package:careerspeak_app/app/asset_download_providers.dart';\n"
          if asset_import not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('application bootstrap import anchor changed')
              text = text.replace(import_anchor, import_anchor + asset_import, 1)

          client_anchor = """      final backend = _LearnerApiFixture();
      final client = MockClient(backend.handle);
      addTearDown(database.close);
      addTearDown(client.close);

      const screenshotKey = Key('production-e2e-screenshot');
"""
          client_replacement = """      final backend = _LearnerApiFixture();
      final client = MockClient(backend.handle);
      final assetRootDirectory = (await tester.runAsync(
        () => Directory.systemTemp.createTemp(
          'careerspeak-p2-10-7-assets-',
        ),
      ))!;
      addTearDown(database.close);
      addTearDown(client.close);
      addTearDown(() => assetRootDirectory.delete(recursive: true));

      const screenshotKey = Key('production-e2e-screenshot');
"""
          if text.count(client_anchor) != 1:
              raise SystemExit(f'expected one renderer fixture anchor, got {text.count(client_anchor)}')
          text = text.replace(client_anchor, client_replacement, 1)

          override_anchor = """        overrides: [
          careerSpeakDatabaseProvider.overrideWithValue(database),
"""
          override_replacement = """        overrides: [
          careerSpeakDatabaseProvider.overrideWithValue(database),
          assetRootDirectoryProvider.overrideWith(
            (ref) async => assetRootDirectory,
          ),
"""
          if text.count(override_anchor) != 1:
              raise SystemExit(f'expected one production ProviderScope override anchor, got {text.count(override_anchor)}')
          text = text.replace(override_anchor, override_replacement, 1)

          path.write_text(text)
          PY

      - name: Canonical format
        run: dart format test/acceptance/p2_10_7_production_e2e_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Qualify P2.10.7 before commit
        run: |
          timeout 150s flutter test \
            test/acceptance/p2_10_7_production_e2e_test.dart \
            --reporter expanded

      - name: Commit fixture repair
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/careerspeak_app/test/acceptance/p2_10_7_production_e2e_test.dart
          git commit -m 'test(p2): stabilize production E2E bootstrap fixture'
          git push origin HEAD:feat/learner-product-ui-v1
