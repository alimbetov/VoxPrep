name: P2.10.7 Fixture Fix

on:
  push:
    branches:
      - feat/learner-product-ui-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/careerspeak_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/learner-product-ui-v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Repair canonical manifest checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/acceptance/p2_10_7_production_e2e_test.dart')
          text = path.read_text()

          old_root = "'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'"
          new_root = "'e0bb83877e16655a6b9a649f31d1d727abafe82623fec74f21e5a5a9a215372f'"
          old_pack = "'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'"
          new_pack = "'6945dc3f01162e5e3bf39cc7a2553b2aeb4da712fe330c7ad8d881e558b0c09d'"

          if text.count(old_root) != 1:
              raise SystemExit(f'expected one stale root checksum, got {text.count(old_root)}')
          if text.count(old_pack) != 1:
              raise SystemExit(f'expected one stale pack checksum, got {text.count(old_pack)}')

          text = text.replace(old_root, new_root, 1)
          text = text.replace(old_pack, new_pack, 1)
          path.write_text(text)
          PY

      - name: Canonical format
        run: dart format test/acceptance/p2_10_7_production_e2e_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Qualify P2.10.7 before commit
        run: |
          timeout 150s flutter test \
            test/acceptance/p2_10_7_production_e2e_test.dart \
            --reporter expanded

      - name: Commit fixture repair
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/careerspeak_app/test/acceptance/p2_10_7_production_e2e_test.dart
          git commit -m 'test(p2): canonicalize production E2E manifest fixtures'
          git push origin HEAD:feat/learner-product-ui-v1
