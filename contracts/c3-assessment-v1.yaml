openapi: 3.1.0
info:
  title: CareerSpeak C3 Assessment Components
  version: 0.1.0
  description: >-
    Normative C3 component contract for immutable practice-test revisions,
    immutable question revisions, exact ordered membership and deterministic
    scoring. Endpoint/publication wiring remains C4.
paths: {}
components:
  schemas:
    BusinessCode:
      type: string
      minLength: 1
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'

    StableCode:
      type: string
      minLength: 1
      pattern: '^[A-Z0-9][A-Z0-9._-]*$'

    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'

    PositiveRevision:
      type: integer
      minimum: 1

    AssessmentMode:
      type: string
      enum: [learn, exam, quick]

    QuestionKind:
      type: string
      enum: [singleChoice]

    SingleChoiceQuestionBody:
      type: object
      additionalProperties: false
      required:
        - kind
        - prompt
        - options
        - correctOptionIndex
        - skillCode
        - explanation
      properties:
        kind:
          const: singleChoice
        prompt:
          type: string
          minLength: 1
        options:
          type: array
          minItems: 2
          uniqueItems: true
          items:
            type: string
            minLength: 1
        correctOptionIndex:
          type: integer
          minimum: 0
        skillCode:
          $ref: '#/components/schemas/StableCode'
        explanation:
          type: string
          minLength: 1

    QuestionRevision:
      type: object
      additionalProperties: false
      required:
        - questionCode
        - revision
        - checksum
        - body
      properties:
        questionCode:
          $ref: '#/components/schemas/BusinessCode'
        revision:
          $ref: '#/components/schemas/PositiveRevision'
        checksum:
          $ref: '#/components/schemas/Sha256'
        body:
          $ref: '#/components/schemas/SingleChoiceQuestionBody'

    QuestionRevisionRef:
      type: object
      additionalProperties: false
      required:
        - questionCode
        - revision
        - checksum
      properties:
        questionCode:
          $ref: '#/components/schemas/BusinessCode'
        revision:
          $ref: '#/components/schemas/PositiveRevision'
        checksum:
          $ref: '#/components/schemas/Sha256'

    TestQuestionRef:
      type: object
      additionalProperties: false
      required:
        - order
        - question
        - points
      properties:
        order:
          type: integer
          minimum: 0
        question:
          $ref: '#/components/schemas/QuestionRevisionRef'
        points:
          type: integer
          minimum: 1

    PracticeTestRevision:
      type: object
      additionalProperties: false
      required:
        - practiceTestCode
        - revision
        - checksum
        - title
        - subtitle
        - mode
        - passingScoreBasisPoints
        - questionRefs
      properties:
        practiceTestCode:
          $ref: '#/components/schemas/BusinessCode'
        revision:
          $ref: '#/components/schemas/PositiveRevision'
        checksum:
          $ref: '#/components/schemas/Sha256'
        title:
          type: string
          minLength: 1
        subtitle:
          type: string
          minLength: 1
        mode:
          $ref: '#/components/schemas/AssessmentMode'
        passingScoreBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
        questionRefs:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TestQuestionRef'

    AssessmentAnswer:
      type: object
      additionalProperties: false
      required:
        - order
        - selectedOptionIndex
      properties:
        order:
          type: integer
          minimum: 0
        selectedOptionIndex:
          type: integer
          minimum: 0

    AssessmentScore:
      type: object
      additionalProperties: false
      required:
        - earnedPoints
        - totalPoints
        - correctCount
        - questionCount
        - scoreBasisPoints
        - passed
      properties:
        earnedPoints:
          type: integer
          minimum: 0
        totalPoints:
          type: integer
          minimum: 1
        correctCount:
          type: integer
          minimum: 0
        questionCount:
          type: integer
          minimum: 1
        scoreBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
        passed:
          type: boolean
