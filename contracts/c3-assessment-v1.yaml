openapi: 3.1.0
info:
  title: CareerSpeak C3 Assessment API
  version: 0.2.0
  description: >-
    Normative C3 contract for immutable practice-test revisions, immutable
    question revisions, exact ordered membership and deterministic scoring.
    C3 owns exact assessment payload delivery. Publication membership and atomic
    root composition remain C4.

paths:
  /api/v1/assessment/practice-tests/{practiceTestCode}/revisions/{revision}:
    get:
      operationId: getPracticeTestRevision
      security:
        - installationBearer: []
      parameters:
        - name: practiceTestCode
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/BusinessCode'
        - name: revision
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PositiveRevision'
      responses:
        '200':
          description: Exact immutable practice-test revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeTestRevision'
        '400':
          description: Invalid exact revision request.
        '401':
          description: Installation credential rejected.
        '403':
          description: Installation is not allowed to access the payload.
        '404':
          description: Exact practice-test revision does not exist.
        '500':
          description: Server failure.

  /api/v1/assessment/questions/{questionCode}/revisions/{revision}:
    get:
      operationId: getQuestionRevision
      security:
        - installationBearer: []
      parameters:
        - name: questionCode
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/BusinessCode'
        - name: revision
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PositiveRevision'
      responses:
        '200':
          description: Exact immutable question revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionRevision'
        '400':
          description: Invalid exact revision request.
        '401':
          description: Installation credential rejected.
        '403':
          description: Installation is not allowed to access the payload.
        '404':
          description: Exact question revision does not exist.
        '500':
          description: Server failure.

components:
  securitySchemes:
    installationBearer:
      type: http
      scheme: bearer
      description: Opaque backend-issued installation token.

  schemas:
    BusinessCode:
      type: string
      minLength: 1
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'

    StableCode:
      type: string
      minLength: 1
      pattern: '^[A-Z0-9][A-Z0-9._-]*$'

    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'

    PositiveRevision:
      type: integer
      minimum: 1

    AssessmentMode:
      type: string
      enum: [learn, exam, quick]

    QuestionKind:
      type: string
      enum: [singleChoice]

    SingleChoiceQuestionBody:
      type: object
      additionalProperties: false
      required:
        - kind
        - prompt
        - options
        - correctOptionIndex
        - skillCode
        - explanation
      properties:
        kind:
          const: singleChoice
        prompt:
          type: string
          minLength: 1
        options:
          type: array
          minItems: 2
          uniqueItems: true
          items:
            type: string
            minLength: 1
        correctOptionIndex:
          type: integer
          minimum: 0
        skillCode:
          $ref: '#/components/schemas/StableCode'
        explanation:
          type: string
          minLength: 1

    QuestionRevision:
      type: object
      additionalProperties: false
      required:
        - questionCode
        - revision
        - checksum
        - body
      properties:
        questionCode:
          $ref: '#/components/schemas/BusinessCode'
        revision:
          $ref: '#/components/schemas/PositiveRevision'
        checksum:
          $ref: '#/components/schemas/Sha256'
        body:
          $ref: '#/components/schemas/SingleChoiceQuestionBody'

    QuestionRevisionRef:
      type: object
      additionalProperties: false
      required:
        - questionCode
        - revision
        - checksum
      properties:
        questionCode:
          $ref: '#/components/schemas/BusinessCode'
        revision:
          $ref: '#/components/schemas/PositiveRevision'
        checksum:
          $ref: '#/components/schemas/Sha256'

    TestQuestionRef:
      type: object
      additionalProperties: false
      required:
        - order
        - question
        - points
      properties:
        order:
          type: integer
          minimum: 0
        question:
          $ref: '#/components/schemas/QuestionRevisionRef'
        points:
          type: integer
          minimum: 1

    PracticeTestRevision:
      type: object
      additionalProperties: false
      required:
        - practiceTestCode
        - revision
        - checksum
        - title
        - subtitle
        - mode
        - passingScoreBasisPoints
        - questionRefs
      properties:
        practiceTestCode:
          $ref: '#/components/schemas/BusinessCode'
        revision:
          $ref: '#/components/schemas/PositiveRevision'
        checksum:
          $ref: '#/components/schemas/Sha256'
        title:
          type: string
          minLength: 1
        subtitle:
          type: string
          minLength: 1
        mode:
          $ref: '#/components/schemas/AssessmentMode'
        passingScoreBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
        questionRefs:
          type: array
          minItems: 1
          description: >-
            Array order is semantic and must match each item's contiguous order
            field starting at zero. Flutter must not sort or normalize this array.
          items:
            $ref: '#/components/schemas/TestQuestionRef'

    AssessmentAnswer:
      type: object
      additionalProperties: false
      required:
        - order
        - selectedOptionIndex
      properties:
        order:
          type: integer
          minimum: 0
        selectedOptionIndex:
          type: integer
          minimum: 0

    AssessmentScore:
      type: object
      additionalProperties: false
      required:
        - earnedPoints
        - totalPoints
        - correctCount
        - questionCount
        - scoreBasisPoints
        - passed
      properties:
        earnedPoints:
          type: integer
          minimum: 0
        totalPoints:
          type: integer
          minimum: 1
        correctCount:
          type: integer
          minimum: 0
        questionCount:
          type: integer
          minimum: 1
        scoreBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
        passed:
          type: boolean
