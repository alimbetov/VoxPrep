schemaVersion: 1
catalogId: careerspeak-piper-production-v1
catalogVersion: 1
status: PRODUCTION
engine: piper
defaultLocale: en_US
defaultModelId: en_US-lessac-high

selectionPolicy:
  requireExactLocale: true
  requireExactModelId: true
  allowSilentVoiceSubstitution: false
  allowCrossLocaleFallback: false

artifactPinning:
  requiredForEnabledModels: true
  requiredAtProvisioning: true
  requiredModelFields:
    - revision
    - modelSha256
    - configSha256
    - modelSizeBytes
    - configSizeBytes
  note: >
    This catalog selects stable Piper model identities. Production provisioning
    MUST resolve and persist immutable artifact revision, SHA-256 digests, and
    sizes in tts_voice_model before a model becomes synthesis-eligible.

provisioningPolicies:
  STRICT:
    productionReadinessGate: true
    reconcileRequired: true
    synthesisRequiresVerifiedModel: true
  ENSURE_PRESENT:
    productionReadinessGate: false
    reconcileRequired: true
    synthesisRequiresVerifiedModel: true
  DISABLED:
    productionReadinessGate: false
    reconcileRequired: false
    synthesisAllowed: false

voices:
  - locale: en_US
    voice: lessac
    quality: high
    modelId: en_US-lessac-high
    role: PRIMARY_US_ENGLISH
    provisioning: STRICT
    enabled: true

  - locale: en_GB
    voice: cori
    quality: high
    modelId: en_GB-cori-high
    role: BRITISH_ENGLISH
    provisioning: ENSURE_PRESENT
    enabled: true

  - locale: de_DE
    voice: thorsten
    quality: high
    modelId: de_DE-thorsten-high
    role: GERMAN
    provisioning: STRICT
    enabled: true

  - locale: tr_TR
