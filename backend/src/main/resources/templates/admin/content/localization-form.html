<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/fragments/shell :: layout('Localization editor', 'content', ~{::main})}">
<main>
    <div class="d-flex justify-content-between align-items-start mb-4">
        <div>
            <span class="badge text-bg-secondary mb-2">MVC-R4.1</span>
            <h1 class="h3 mb-1" th:text="${localization == null ? 'New localization' : 'Edit localization'}">Localization</h1>
            <p class="text-secondary" th:text="${contentRevision.contentCode}">Content code</p>
            <p th:if="${localization != null}" class="text-secondary"
               th:text="${localization.locale + ' · revision ' + localization.localizationRevisionNumber + ' · ' + localization.lifecycle}">State</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/admin/content/revisions/{id}/localizations(id=${contentRevision.id})}">Back to localizations</a>
    </div>
    <div th:if="${flashSuccess}" class="alert alert-success" th:text="${flashSuccess}"></div>
    <form method="post" th:object="${form}"
          th:action="${localization == null} ? @{/admin/content/revisions/{id}/localizations(id=${contentRevision.id})} : @{/admin/content/localizations/{id}(id=${localization.id})}">
        <input type="hidden" th:field="*{expectedVersion}">
        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
            <div th:each="error : ${#fields.globalErrors()}" th:text="${error}">Invalid localization</div>
        </div>
        <div class="card studio-card mb-4"><div class="card-body p-4">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label" for="locale">BCP-47 locale</label>
                    <input class="form-control" id="locale" th:field="*{locale}" placeholder="kk-KZ"
                           th:readonly="${localization != null}">
                    <div class="text-danger small" th:errors="*{locale}"></div>
                </div>
                <div class="col-12"><label class="form-label" for="localizedTitle">Localized title</label>
                    <input class="form-control" id="localizedTitle" th:field="*{title}"
                           th:readonly="${localization != null and localization.lifecycle.name() != 'DRAFT'}">
                    <div class="text-danger small" th:errors="*{title}"></div>
                </div>
                <div class="col-12"><label class="form-label">Subtitle</label>
                    <input class="form-control" th:field="*{subtitle}"
                           th:readonly="${localization != null and localization.lifecycle.name() != 'DRAFT'}">
                    <div class="text-danger small" th:errors="*{subtitle}"></div>
                </div>
                <div class="col-12"><label class="form-label">Description</label>
                    <textarea class="form-control" rows="3" th:field="*{description}"
                              th:readonly="${localization != null and localization.lifecycle.name() != 'DRAFT'}"></textarea>
                    <div class="text-danger small" th:errors="*{description}"></div>
                </div>
                <div class="col-12"><label class="form-label">Translation</label>
                    <textarea class="form-control" rows="6" th:field="*{translation}"
                              th:readonly="${localization != null and localization.lifecycle.name() != 'DRAFT'}"></textarea>
                </div>
                <div class="col-12"><label class="form-label">Hint</label>
                    <textarea class="form-control" rows="3" th:field="*{hint}"
                              th:readonly="${localization != null and localization.lifecycle.name() != 'DRAFT'}"></textarea>
                </div>
                <div class="col-12"><label class="form-label">Explanation</label>
                    <textarea class="form-control" rows="4" th:field="*{explanation}"
                              th:readonly="${localization != null and localization.lifecycle.name() != 'DRAFT'}"></textarea>
                </div>
            </div>
        </div></div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit"
                    th:if="${localization == null or localization.lifecycle.name() == 'DRAFT'}">Save localization draft</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/content/revisions/{id}/localizations(id=${contentRevision.id})}">Cancel</a>
            <span class="text-secondary align-self-center"
                  th:if="${localization != null and localization.lifecycle.name() != 'DRAFT'}">Approved/review revisions are read-only.</span>
        </div>
    </form>
</main>
</html>
