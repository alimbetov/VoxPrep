<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/fragments/shell :: layout('Content', 'content', ~{::main})}">
<main>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <span class="badge text-bg-secondary mb-2">MVC-R3.1</span>
            <h1 class="h3 mb-1">Content revisions</h1>
            <p class="text-secondary mb-0">Edit existing draft revisions through the production authoring service.</p>
        </div>
    </div>

    <div th:if="${flashSuccess}" class="alert alert-success" th:text="${flashSuccess}"></div>

    <div class="card studio-card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Code</th>
                    <th>Type</th>
                    <th>Revision</th>
                    <th>Lifecycle</th>
                    <th>Title</th>
                    <th>Level</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="revision : ${revisions.content}">
                    <td><code th:text="${revision.contentCode}">code</code></td>
                    <td th:text="${revision.contentType}">VOCABULARY</td>
                    <td th:text="${revision.revisionNumber}">1</td>
                    <td><span class="badge text-bg-light" th:text="${revision.lifecycle}">DRAFT</span></td>
                    <td th:text="${revision.title}">Title</td>
                    <td th:text="${revision.levelCode}">B2</td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/admin/content/revisions/{id}/edit(id=${revision.id})}">Edit</a>
                    </td>
                </tr>
                <tr th:if="${revisions.empty}">
                    <td colspan="7" class="text-center text-secondary py-5">No content revisions found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-3" th:if="${revisions.totalPages > 1}" aria-label="Content pages">
        <ul class="pagination mb-0">
            <li class="page-item" th:classappend="${revisions.first} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/content(page=${revisions.number - 1})}">Previous</a>
            </li>
            <li class="page-item disabled"><span class="page-link" th:text="${(revisions.number + 1) + ' / ' + revisions.totalPages}">1 / 1</span></li>
            <li class="page-item" th:classappend="${revisions.last} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/content(page=${revisions.number + 1})}">Next</a>
            </li>
        </ul>
    </nav>
</main>
</html>
