<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<dialog th:fragment="picker" id="mediaPicker" aria-labelledby="mediaPickerTitle"
        style="width:min(960px,94vw);max-height:90vh;border:0;border-radius:12px;padding:24px">
    <div class="d-flex justify-content-between mb-3">
        <h2 class="h4" id="mediaPickerTitle">Media Library</h2>
        <button type="button" class="btn btn-outline-secondary" data-media-close>Close</button>
    </div>
    <p class="text-secondary">Choose a verified image or upload PNG, JPEG or WebP. Your form stays open.</p>
    <label for="mediaPickerFile" class="form-label">Upload image</label>
    <div class="d-flex gap-2 mb-3">
        <input type="file" id="mediaPickerFile" class="form-control" accept="image/png,image/jpeg,image/webp">
        <button type="button" class="btn btn-primary" data-media-upload>Upload</button>
    </div>
    <p role="status" aria-live="polite" data-media-status></p>
    <div class="row g-3" data-media-grid></div>
    <div class="d-flex gap-2 mt-3">
        <button type="button" class="btn btn-outline-secondary" data-media-prev>Previous</button>
        <button type="button" class="btn btn-outline-secondary" data-media-next>Next</button>
    </div>
</dialog>
</html>
