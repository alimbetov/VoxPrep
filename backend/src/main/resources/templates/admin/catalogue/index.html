<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/fragments/shell :: layout('Catalogue', ${activeSection}, ~{::main})}">
<main>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Catalogue</h1>
            <p class="text-secondary mb-0">Author learner hierarchy through application services.</p>
        </div>
        <a class="btn btn-dark" th:href="@{/admin/catalogue/verticals/new}">Add vertical</a>
    </div>

    <div class="row g-3">
        <div class="col-12 col-xl-3">
            <div class="card studio-card h-100"><div class="card-body">
                <h2 class="h5">Verticals</h2>
                <div class="list-group list-group-flush">
                    <a th:each="item : ${verticals}" class="list-group-item list-group-item-action px-0"
                       th:classappend="${item.id() == selectedVerticalId} ? ' fw-semibold'"
                       th:href="@{/admin/catalogue(verticalId=${item.id()})}">
                        <span th:text="${item.title()}">Vertical</span>
                        <small class="d-block text-secondary" th:text="${item.code()}">CODE</small>
                    </a>
                </div>
                <a th:if="${selectedVerticalId != null}" class="btn btn-sm btn-outline-secondary mt-3"
                   th:href="@{/admin/catalogue/verticals/{id}/edit(id=${selectedVerticalId})}">Edit selected</a>
            </div></div>
        </div>

        <div class="col-12 col-xl-3">
            <div class="card studio-card h-100"><div class="card-body">
                <div class="d-flex justify-content-between align-items-center"><h2 class="h5 mb-0">Goals</h2>
                    <a th:if="${selectedVerticalId != null}" class="btn btn-sm btn-outline-dark"
                       th:href="@{/admin/catalogue/goals/new(verticalId=${selectedVerticalId})}">Add</a></div>
                <div class="list-group list-group-flush mt-2">
                    <a th:each="item : ${goals}" class="list-group-item list-group-item-action px-0"
                       th:classappend="${item.id() == selectedGoalId} ? ' fw-semibold'"
                       th:href="@{/admin/catalogue(verticalId=${selectedVerticalId},goalId=${item.id()})}">
                        <span th:text="${item.title()}">Goal</span><small class="d-block text-secondary" th:text="${item.code()}">CODE</small>
                    </a>
                </div>
                <a th:if="${selectedGoalId != null}" class="btn btn-sm btn-outline-secondary mt-3"
                   th:href="@{/admin/catalogue/goals/{id}/edit(id=${selectedGoalId})}">Edit selected</a>
            </div></div>
        </div>

        <div class="col-12 col-xl-3">
            <div class="card studio-card h-100"><div class="card-body">
                <div class="d-flex justify-content-between align-items-center"><h2 class="h5 mb-0">Tracks</h2>
                    <a th:if="${selectedGoalId != null}" class="btn btn-sm btn-outline-dark"
                       th:href="@{/admin/catalogue/tracks/new(goalId=${selectedGoalId})}">Add</a></div>
                <div class="list-group list-group-flush mt-2">
                    <a th:each="item : ${tracks}" class="list-group-item list-group-item-action px-0"
                       th:classappend="${item.id() == selectedTrackId} ? ' fw-semibold'"
                       th:href="@{/admin/catalogue(verticalId=${selectedVerticalId},goalId=${selectedGoalId},trackId=${item.id()})}">
                        <span th:text="${item.title()}">Track</span><small class="d-block text-secondary" th:text="${item.code()}">CODE</small>
                    </a>
                </div>
                <a th:if="${selectedTrackId != null}" class="btn btn-sm btn-outline-secondary mt-3"
                   th:href="@{/admin/catalogue/tracks/{id}/edit(id=${selectedTrackId})}">Edit selected</a>
            </div></div>
        </div>

        <div class="col-12 col-xl-3">
            <div class="card studio-card h-100"><div class="card-body">
                <div class="d-flex justify-content-between align-items-center"><h2 class="h5 mb-0">Collections</h2>
                    <a th:if="${selectedTrackId != null}" class="btn btn-sm btn-outline-dark"
                       th:href="@{/admin/catalogue/collections/new(trackId=${selectedTrackId})}">Add</a></div>
                <div class="list-group list-group-flush mt-2">
                    <div th:each="item : ${collections}" class="list-group-item px-0">
                        <span th:text="${item.title()}">Collection</span>
                        <small class="d-block text-secondary">
                            <span th:text="${item.code()}">CODE</span>
                            <span class="badge ms-1"
                                  th:classappend="${item.accessLevel() == 'FULL'} ? 'text-bg-warning' : 'text-bg-success'"
                                  th:text="${item.accessLevel() == 'FULL'} ? '$ FULL' : 'FREE'">FREE</span>
                        </small>
                        <a class="small" th:href="@{/admin/catalogue/collections/{id}/edit(id=${item.id()})}">Edit</a>
                    </div>
                </div>
            </div></div>
        </div>
    </div>
</main>
</html>
