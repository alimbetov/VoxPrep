spring:
  application:
    name: voxprep-backend
  config:
    import: "optional:configtree:/run/secrets/"

  datasource:
    url: ${VOXPREP_DB_URL:jdbc:postgresql://postgres:5432/voxprep}
    username: ${VOXPREP_DB_RUNTIME_USERNAME:voxprep_backend}
    password: ${postgres_backend_password}
    hikari:
      pool-name: VoxPrepHikariPool
      minimum-idle: ${VOXPREP_DB_POOL_MIN_IDLE:2}
      maximum-pool-size: ${VOXPREP_DB_POOL_MAX_SIZE:10}
      connection-timeout: ${VOXPREP_DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${VOXPREP_DB_VALIDATION_TIMEOUT_MS:2000}
      idle-timeout: ${VOXPREP_DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${VOXPREP_DB_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${VOXPREP_DB_KEEPALIVE_TIME_MS:300000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
        jdbc:
          time_zone: UTC

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    url: ${VOXPREP_DB_URL:jdbc:postgresql://postgres:5432/voxprep}
    user: ${VOXPREP_DB_MIGRATOR_USERNAME:voxprep_migrator}
    password: ${postgres_migrator_password}
    default-schema: app
    liquibase-schema: liquibase
    drop-first: false

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,rustFs

voxprep:
  storage:
    endpoint: ${VOXPREP_STORAGE_ENDPOINT:http://rustfs:9000}
    region: ${VOXPREP_STORAGE_REGION:us-east-1}
    bucket: ${VOXPREP_STORAGE_BUCKET:voxprep-assets}
    access-key: ${rustfs_backend_access_key}
    secret-key: ${rustfs_backend_secret_key}
    connect-timeout: ${VOXPREP_STORAGE_CONNECT_TIMEOUT:2s}
    socket-timeout: ${VOXPREP_STORAGE_SOCKET_TIMEOUT:5s}
    max-connections: ${VOXPREP_STORAGE_MAX_CONNECTIONS:50}
  worker-delivery:
    api-key: ${VOXPREP_WORKER_API_KEY:${worker_api_key}}
    url-ttl: ${VOXPREP_WORKER_MODEL_URL_TTL:5m}
    lease-duration: ${VOXPREP_WORKER_LEASE_DURATION:2m}
  security:
    admin:
      username: ${VOXPREP_ADMIN_USERNAME:admin}
      password: ${VOXPREP_ADMIN_PASSWORD:888}
