databaseChangeLog:
  - include:
      file: db/changelog/db.changelog-master.yaml
  - changeSet:
      id: test-0001-foundation-runtime-probe
      author: voxprep-test
      context: test
      changes:
        - createTable:
            schemaName: app
            tableName: foundation_runtime_probe
